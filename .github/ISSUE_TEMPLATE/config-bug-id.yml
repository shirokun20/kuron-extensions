name: 🐞 Bug config (Bahasa Indonesia)
description: Laporkan config sumber yang salah / rusak / tidak sinkron dengan situs aslinya.
title: "[bug][id] "
labels: ["config-verify", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Laporan bug **config sumber** (bukan bug aplikasi).
        Emoji status: `✅` jalan · `⚠️` partial · `✖️` tidak ada · `🚫` config menyatakan bisa tapi aktualnya tidak ada.
        Kolom fitur yang dicek: Home, Home+Pag+Total, Search, Search+Pag+Total, Detail+Chapters, Reader, Genre+Pag, Tag+Pag, Author+Pag, Artist+Pag.
  - type: input
    id: source
    attributes:
      label: Source id
      description: Id config yang bermasalah, contoh `komiku`, `hentairead`
      placeholder: komiku
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Path config
      description: Path file config di repo ini
      placeholder: config/id/komiku-config.json
    validations:
      required: true
  - type: input
    id: baseurl
    attributes:
      label: baseUrl
      placeholder: https://komiku.org
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi config
      description: isi `version` dari config (semver penuh)
      placeholder: 1.0.1
    validations:
      required: false
  - type: dropdown
    id: kolom
    attributes:
      label: Kolom fitur yang bermasalah
      multiple: true
      options:
        - Home
        - Home + Pag + Total
        - Search
        - Search + Pag + Total
        - Detail + Chapters
        - Reader (image/video)
        - Genre + Pag
        - Tag + Pag
        - Author + Pag
        - Artist + Pag
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status fitur
      description: pilih sesuai tabel `SUPPORT-CONFIG.md`
      options:
        - "⚠️ partial - jalan tapi rusak sebagian"
        - "✖️ tidak ada / route tidak ditemukan"
        - "🚫 config menyatakan bisa tapi aktualnya tidak ada"
        - "✅ rusak padahal ditandai ✅ di matrix"
    validations:
      required: true
  - type: dropdown
    id: jenis
    attributes:
      label: Jenis masalah
      options:
        - Route / URL pattern salah
        - Selector tidak cocok dengan HTML situs
        - Pagination rusak / halaman berikutnya kosong
        - Total halaman atau total item tidak terbaca
        - Chapter list tidak terbaca
        - Gambar reader gagal dimuat (403/hotlink)
        - Source mati / domain berubah / di blokir
        - Config tidak sinkron dengan manifest.json
        - Lainnya
    validations:
      required: true
  - type: textarea
    id: diharapkan
    attributes:
      label: Yang diharapkan
      description: perilaku yang seharusnya
    validations:
      required: true
  - type: textarea
    id: aktual
    attributes:
      label: Yang terjadi
      description: perilaku yang teramati, sertakan route yang dicoba
    validations:
      required: true
  - type: textarea
    id: bukti
    attributes:
      label: Bukti
      description: |
        Tempel hasil `curl` (HTTP status + cuplikan HTML), log aplikasi, atau screenshot.
        Contoh: `curl -sI -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0' <url>`
      render: text
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Saran perbaikan
      description: Opsional. Usulan perubahan route/selector + alasan.
    validations:
      required: false
  - type: checkboxes
    id: cek
    attributes:
      label: Checklist
      options:
        - label: Sudah cek issue existing, belum ada duplikat
          required: true
        - label: Config masih ada di bucketnya (bukan `config/new/`)
          required: true
        - label: Bukti di atas bisa direproduksi (sudah dicoba minimal 2x, bukan kondisi kilat)
          required: false
