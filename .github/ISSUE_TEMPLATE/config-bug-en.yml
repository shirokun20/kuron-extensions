name: 🐞 Config bug (English)
description: Report a broken source config, or a config that no longer matches its live site.
title: "[bug][en] "
labels: ["config-verify", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a **source config** problem (not an app bug).
        Status emoji: `✅` works · `⚠️` partial · `✖️` missing · `🚫` config claims support but the site does not provide it.
        Feature columns: Home, Home+Pag+Total, Search, Search+Pag+Total, Detail+Chapters, Reader, Genre+Pag, Tag+Pag, Author+Pag, Artist+Pag.
  - type: input
    id: source
    attributes:
      label: Source id
      description: The broken config id, e.g. `komiku`, `hentairead`
      placeholder: komiku
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Config path
      description: Path to the config file in this repo
      placeholder: config/id/komiku-config.json
    validations:
      required: true
  - type: input
    id: baseurl
    attributes:
      label: baseUrl
      placeholder: https://komiku.org
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Config version
      description: The `version` field from the config (full semver)
      placeholder: 1.0.1
    validations:
      required: false
  - type: dropdown
    id: column
    attributes:
      label: Broken feature column(s)
      multiple: true
      options:
        - Home
        - Home + Pag + Total
        - Search
        - Search + Pag + Total
        - Detail + Chapters
        - Reader (image/video)
        - Genre + Pag
        - Tag + Pag
        - Author + Pag
        - Artist + Pag
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Feature status
      description: Same value as in `SUPPORT-CONFIG.md`
      options:
        - "⚠️ partial - works but partially broken"
        - "✖️ missing - route/selector not found"
        - "🚫 config claims support but the site does not provide it"
        - "✅ broken even though the matrix marks it ✅"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Wrong route / URL pattern
        - Selector does not match the site HTML
        - Pagination broken / later pages empty
        - Total page or item count unreadable
        - Chapter list unreadable
        - Reader images fail to load (403 / hotlink)
        - Source down / domain changed / blocked
        - Config out of sync with manifest.json
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What you observed, including the exact route you requested
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Paste `curl` output (HTTP status + HTML snippet), app logs, or a screenshot.
        Example: `curl -sI -o /dev/null -w '%{http_code}\n' -A 'Mozilla/5.0' <url>`
      render: text
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: Optional. Proposed route/selector change and why.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues, this is not a duplicate
          required: true
        - label: The config still lives in its bucket (not in `config/new/`)
          required: true
        - label: The evidence is reproducible (tried at least twice, not a transient failure)
          required: false
