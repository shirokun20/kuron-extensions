name: canary

# Scheduled upstream-drift watchdog (Refs #62, #64).
# Twice a week, probe a rotating sample of sources (Home + Search), compare
# HTTP status / item counts with the cached baseline, publish the report as a
# job summary + artifact, and open (or comment on) a single tracking issue when
# critical drift is found.
on:
  schedule:
    # Mon + Thu 03:17 UTC (10:17 WIB) - off the hour on purpose
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
    inputs:
      sample:
        description: "Number of sources to probe"
        required: false
        default: "30"
      bucket:
        description: "Limit to one bucket (empty = all)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  probe:
    name: canary probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore canary baseline
        uses: actions/cache@v4
        with:
          path: .canary
          key: canary-state-${{ github.run_id }}
          restore-keys: |
            canary-state-

      - name: Probe with jitter and rate limiting
        id: probe
        env:
          SAMPLE: ${{ github.event.inputs.sample || '30' }}
          BUCKET: ${{ github.event.inputs.bucket || '' }}
          SEED: ${{ github.run_number }}
        run: |
          set -uo pipefail
          args=(--sample "${SAMPLE}" --seed "${SEED}" --delay 2 --jitter 0.5
                --timeout 15 --baseline .canary/baseline.json
                --update-baseline --output .canary/report.json
                --markdown canary-report.md --fail-on-drift)
          if [ -n "${BUCKET}" ]; then
            args+=(--bucket "${BUCKET}")
          fi
          echo "python3 scripts/canary_probe.py ${args[*]}"
          python3 scripts/canary_probe.py "${args[@]}"
          status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Publish job summary
        if: always()
        run: |
          if [ -f canary-report.md ]; then
            cat canary-report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Canary report was not produced." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: |
            canary-report.md
            .canary/report.json
            .canary/baseline.json
          if-no-files-found: warn

      - name: Open or update the canary tracking issue
        if: steps.probe.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create canary --color "d93f0b" \
            --description "Automated canary drift report" --force >/dev/null 2>&1 || true
          title="[canary] upstream drift detected (run ${GITHUB_RUN_NUMBER})"
          body_file="canary-report.md"
          [ -f "${body_file}" ] || echo "Canary probe failed before writing a report." > "${body_file}"
          {
            echo ""
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo '_Generated by .github/workflows/canary.yml - close after re-verify (`kuron-config-verify`)._'
          } >> "${body_file}"
          existing=$(gh issue list --label canary --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${body_file}"
          else
            gh issue create --title "${title}" --body-file "${body_file}" --label canary
          fi
